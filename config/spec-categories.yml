# Category mapping for the unified Swagger UI portal.
#
# Conventions:
#   - A spec listed in `members` of multiple categories appears in each of them
#     (multi-category support — useful for cross-cutting APIs).
#   - A spec NOT listed under any category falls into `default_category`.
#   - The build step (scripts/gen_initializer.py) emits a warning per
#     uncategorized spec and groups them under "Other / Uncategorized".

default_category:
  id: other
  name: Other / Uncategorized

categories:
  - id: identity
    name: Identity & Access
    members:
      - auth
      - users
      - sessions
      - permissions
      - roles
      - mfa
      - tokens
      - oauth
      - profiles
      - directory
      - sso
      - audit
      - identity-providers

  - id: payments
    name: Payments & Billing
    members:
      - payments
      - transactions
      - accounts
      - ledger
      - invoices
      - billing
      - subscriptions
      - cards
      - transfers
      - fraud
      - kyc
      - statements
      - currencies
      - fees
      - taxes
      - refunds
      - payouts
      - reconciliation
      - disputes

  - id: ecommerce
